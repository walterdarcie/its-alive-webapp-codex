name: Release Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Lint + Build + Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          SETLISTFM_API_KEY: "ci-placeholder"

      - name: Unit tests
        run: npm run test:unit

  e2e:
    name: E2E + Visual QA
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Visual QA
        run: npm run qa:visual

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 14

  search-live:
    # Valida o pipeline real de busca (setlist.fm + Ticketmaster + Supabase) a
    # cada deploy em main. Não roda em PR para preservar o rate limit do
    # setlist.fm (1440 req/dia) e porque os secrets de provedor não são
    # expostos para PRs de forks.
    name: Search Live API Validation
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-fund --no-audit

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Search live tests
        run: npm run test:search
        env:
          LIVE_SEARCH_TESTS: "1"
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          BYPASS_AUTH: "1"

      - name: Upload search-live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-live-playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload search-live test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-live-test-results
          path: test-results
          retention-days: 14
